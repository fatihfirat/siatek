<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#151E2E" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0086D0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F8A627" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0086D0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#273549" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Alpha 'A' Emblem -->
  <g transform="translate(0, 10)" filter="url(#shadow)">
    <!-- Left Leg of A -->
    <path d="M 170 370 L 235 150 L 277 150 L 212 370 Z" fill="url(#primaryGrad)" />
    <!-- Right Leg of A -->
    <path d="M 277 150 L 342 370 L 300 370 L 235 150 Z" fill="url(#primaryGrad)" opacity="0.9" />
    <!-- Crossbar of A (Accent Orange) -->
    <path d="M 195 295 L 317 295 L 307 330 L 185 330 Z" fill="url(#accentGrad)" rx="6" />
    <!-- Top Peak Cap -->
    <polygon points="256,125 285,165 227,165" fill="#38BDF8" />
  </g>

  <!-- Small Tech/HVAC Indicator Dot -->
  <circle cx="370" cy="140" r="16" fill="#2D7B31" stroke="#0B0F19" stroke-width="4" />
</svg>
